[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shapeup-scan"
version = "0.1.0"
description = "Automated application quality assessment tool"
requires-python = ">=3.11"

[project.scripts]
shapeup-scan = "shapeup_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]